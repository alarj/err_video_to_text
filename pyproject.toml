[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "err2text"
version = "0.1.0"
description = "ERR/Jupiter VTT and speaker diarization CLI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "oracledb>=2.5", "python-dotenv>=1.0"]
media = ["yt-dlp>=2025.1.15"]
diarization = ["pyannote.audio>=3.3"]
whisper-review = ["faster-whisper==1.2.1"]
alignment-review = ["transformers"]
test = ["pytest>=8.0"]

[project.scripts]
err2text = "err2text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
