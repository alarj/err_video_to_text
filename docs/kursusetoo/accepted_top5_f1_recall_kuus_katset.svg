    .legend { font-size: 14px; font-weight: 600; }
    .grid { stroke: #d9e1ea; stroke-width: 1; }
    .line { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .recall { fill: none; stroke-width: 2.5; stroke-dasharray: 8 6; opacity: .88; }
    .point { stroke: #fff; stroke-width: 2; }
  </style>
