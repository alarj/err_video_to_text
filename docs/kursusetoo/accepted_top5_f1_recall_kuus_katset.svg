<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">ACCEPTED-klassi viis parimat mudelit: F1 ja Recall / TPR kuues katses</title>
  <desc id="desc">Ühel joondiagrammil on F1 täisjoontena ja Recall / TPR katkendjoontena. Mõlemal teljel on sama protsendiskaala.</desc>
