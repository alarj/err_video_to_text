services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        UGLYERR_REF: ${UGLYERR_REF:?Set an audited UglyERR commit SHA in .env}
        YTDLP_VERSION: ${YTDLP_VERSION:?Set YTDLP_VERSION in .env}
    env_file: .env
    environment:
      ERR2TEXT_RUNTIME_ROOT: ${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
    volumes:
      - ${ERR2TEXT_RUNTIME_ROOT:?Set ERR2TEXT_RUNTIME_ROOT in .env}:${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      - ${ORACLE_CONFIG_DIR:?Set ORACLE_CONFIG_DIR in .env}:${ORACLE_CONFIG_DIR:?Set ORACLE_CONFIG_DIR in .env}:ro
    expose:
      - "8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UGLYERR_REF: ${UGLYERR_REF:?Set an audited UglyERR commit SHA in .env}
        YTDLP_VERSION: ${YTDLP_VERSION:?Set YTDLP_VERSION in .env}
    env_file: .env
    environment:
      ERR2TEXT_RUNTIME_ROOT: ${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      ERR2TEXT_PYTORCH_THREADS: ${ERR2TEXT_PYTORCH_THREADS:?Set ERR2TEXT_PYTORCH_THREADS in .env}
      HOME: ${ERR2TEXT_HOME:?Set ERR2TEXT_HOME in .env}
      USER: ${ERR2TEXT_USER:?Set ERR2TEXT_USER in .env}
      LOGNAME: ${ERR2TEXT_LOGNAME:?Set ERR2TEXT_LOGNAME in .env}
      HF_HOME: ${ERR2TEXT_HF_HOME:?Set ERR2TEXT_HF_HOME in .env}
      HF_HUB_CACHE: ${ERR2TEXT_HF_HUB_CACHE:?Set ERR2TEXT_HF_HUB_CACHE in .env}
      XDG_CACHE_HOME: ${ERR2TEXT_XDG_CACHE_HOME:?Set ERR2TEXT_XDG_CACHE_HOME in .env}
      TORCHINDUCTOR_CACHE_DIR: ${ERR2TEXT_TORCHINDUCTOR_CACHE_DIR:?Set ERR2TEXT_TORCHINDUCTOR_CACHE_DIR in .env}
    volumes:
      - ${ERR2TEXT_RUNTIME_ROOT:?Set ERR2TEXT_RUNTIME_ROOT in .env}:${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      - ${ORACLE_CONFIG_DIR:?Set ORACLE_CONFIG_DIR in .env}:${ORACLE_CONFIG_DIR:?Set ORACLE_CONFIG_DIR in .env}:ro
    user: "${ERR2TEXT_UID:?Set ERR2TEXT_UID in .env}:${ERR2TEXT_GID:?Set ERR2TEXT_GID in .env}"
    cpus: ${ERR2TEXT_WORKER_CPUS:?Set ERR2TEXT_WORKER_CPUS in .env}
    entrypoint: ["python", "backend/worker.py"]

  err2text:
    build:
      context: .
      args:
        # Set this in .env to an audited immutable UglyERR commit SHA.
        UGLYERR_REF: ${UGLYERR_REF:?Set an audited UglyERR commit SHA in .env}
        YTDLP_VERSION: ${YTDLP_VERSION:?Set YTDLP_VERSION in .env}
    env_file: .env
    environment:
      ERR2TEXT_RUNTIME_ROOT: ${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      ERR2TEXT_PYTORCH_THREADS: ${ERR2TEXT_PYTORCH_THREADS:?Set ERR2TEXT_PYTORCH_THREADS in .env}
      HOME: ${ERR2TEXT_HOME:?Set ERR2TEXT_HOME in .env}
      USER: ${ERR2TEXT_USER:?Set ERR2TEXT_USER in .env}
      LOGNAME: ${ERR2TEXT_LOGNAME:?Set ERR2TEXT_LOGNAME in .env}
      HF_HOME: ${ERR2TEXT_HF_HOME:?Set ERR2TEXT_HF_HOME in .env}
      HF_HUB_CACHE: ${ERR2TEXT_HF_HUB_CACHE:?Set ERR2TEXT_HF_HUB_CACHE in .env}
      XDG_CACHE_HOME: ${ERR2TEXT_XDG_CACHE_HOME:?Set ERR2TEXT_XDG_CACHE_HOME in .env}
      TORCHINDUCTOR_CACHE_DIR: ${ERR2TEXT_TORCHINDUCTOR_CACHE_DIR:?Set ERR2TEXT_TORCHINDUCTOR_CACHE_DIR in .env}
    volumes:
      - ${ERR2TEXT_RUNTIME_ROOT:?Set ERR2TEXT_RUNTIME_ROOT in .env}:${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
    user: "${ERR2TEXT_UID:?Set ERR2TEXT_UID in .env}:${ERR2TEXT_GID:?Set ERR2TEXT_GID in .env}"
    cpus: ${ERR2TEXT_WORKER_CPUS:?Set ERR2TEXT_WORKER_CPUS in .env}
    command: ["--help"]

  whisper-review:
    build:
      context: .
      dockerfile: Dockerfile.whisper
      args:
        FASTER_WHISPER_VERSION: ${FASTER_WHISPER_VERSION:?Set FASTER_WHISPER_VERSION in .env}
        PYAV_VERSION: ${PYAV_VERSION:?Set PYAV_VERSION in .env}
        YTDLP_VERSION: ${YTDLP_VERSION:?Set YTDLP_VERSION in .env}
    profiles: ["whisper-review"]
    env_file: .env
    environment:
      ERR2TEXT_RUNTIME_ROOT: ${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      HOME: ${ERR2TEXT_HOME:?Set ERR2TEXT_HOME in .env}
      USER: ${ERR2TEXT_USER:?Set ERR2TEXT_USER in .env}
      LOGNAME: ${ERR2TEXT_LOGNAME:?Set ERR2TEXT_LOGNAME in .env}
      HF_HOME: ${ERR2TEXT_HF_HOME:?Set ERR2TEXT_HF_HOME in .env}
      HF_HUB_CACHE: ${ERR2TEXT_HF_HUB_CACHE:?Set ERR2TEXT_HF_HUB_CACHE in .env}
      XDG_CACHE_HOME: ${ERR2TEXT_XDG_CACHE_HOME:?Set ERR2TEXT_XDG_CACHE_HOME in .env}
    volumes:
      - ${ERR2TEXT_RUNTIME_ROOT:?Set ERR2TEXT_RUNTIME_ROOT in .env}:${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
    user: "${ERR2TEXT_UID:?Set ERR2TEXT_UID in .env}:${ERR2TEXT_GID:?Set ERR2TEXT_GID in .env}"
    cpus: ${ERR2TEXT_WORKER_CPUS:?Set ERR2TEXT_WORKER_CPUS in .env}
    command: ["whisper-review", "--help"]

  alignment-review:
    build:
      context: .
      dockerfile: Dockerfile.alignment
      args:
        TORCH_VERSION: ${TORCH_VERSION:?Set TORCH_VERSION in .env}
        TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION:?Set TRANSFORMERS_VERSION in .env}
        YTDLP_VERSION: ${YTDLP_VERSION:?Set YTDLP_VERSION in .env}
    profiles: ["alignment-review"]
    env_file: .env
    environment:
      ERR2TEXT_RUNTIME_ROOT: ${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
      HOME: ${ERR2TEXT_HOME:?Set ERR2TEXT_HOME in .env}
      USER: ${ERR2TEXT_USER:?Set ERR2TEXT_USER in .env}
      LOGNAME: ${ERR2TEXT_LOGNAME:?Set ERR2TEXT_LOGNAME in .env}
      HF_HOME: ${ERR2TEXT_HF_HOME:?Set ERR2TEXT_HF_HOME in .env}
      HF_HUB_CACHE: ${ERR2TEXT_HF_HUB_CACHE:?Set ERR2TEXT_HF_HUB_CACHE in .env}
      XDG_CACHE_HOME: ${ERR2TEXT_XDG_CACHE_HOME:?Set ERR2TEXT_XDG_CACHE_HOME in .env}
    volumes:
      - ${ERR2TEXT_RUNTIME_ROOT:?Set ERR2TEXT_RUNTIME_ROOT in .env}:${ERR2TEXT_CONTAINER_RUNTIME_ROOT:?Set ERR2TEXT_CONTAINER_RUNTIME_ROOT in .env}
    user: "${ERR2TEXT_UID:?Set ERR2TEXT_UID in .env}:${ERR2TEXT_GID:?Set ERR2TEXT_GID in .env}"
    cpus: ${ERR2TEXT_WORKER_CPUS:?Set ERR2TEXT_WORKER_CPUS in .env}
    command: ["alignment-review", "--help"]
